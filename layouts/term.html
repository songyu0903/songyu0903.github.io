{{ define "main" }}
<article class="markdown book-article">
  <h1>{{ partial "docs/title" . }}</h1>
  {{ .Content }}
  <ul>
  {{- range .Pages }}
    <li><a href="{{ .RelPermalink }}">{{ partial "docs/title" . }}</a>{{ with .Date }} <span class="note-meta">（{{ .Format "2006-01-02" }}）</span>{{ end }}</li>
  {{- end }}
  </ul>
</article>
{{ end }}
