<!-- 首页动态效果：粒子背景 + 打字机标题（DOM 就绪后注入，纯本地资源） -->
<style id="fx-style" disabled>
  #fx-particles {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
  }
  .tw-cursor {
    display: inline-block;
    width: 2px;
    background: currentColor;
    margin-left: 2px;
    animation: tw-blink 0.9s steps(1) infinite;
  }
  @keyframes tw-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* 毛玻璃卡片：单行四列 + 苹果风入场/悬停动画 */
  .fx-cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
    text-align: left;
  }
  @media (max-width: 1024px) {
    .fx-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .fx-cards { grid-template-columns: 1fr; }
  }
  .fx-card {
    position: relative;
    padding: 1.2rem 1.15rem;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.55);
    -webkit-backdrop-filter: blur(16px) saturate(180%);
    backdrop-filter: blur(16px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    animation: fx-card-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    animation-delay: var(--d, 0s);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  html.dark .fx-card {
    background: rgba(18, 40, 66, 0.55);
    border: 1px solid rgba(120, 190, 255, 0.16);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
  }
  .fx-card:hover {
    transform: translateY(-6px) scale(1.015);
    box-shadow: 0 16px 40px rgba(9, 124, 224, 0.18);
  }
  html.dark .fx-card:hover {
    box-shadow: 0 16px 40px rgba(24, 144, 245, 0.28);
  }
  .fx-card h3 {
    margin: 0 0 0.45rem;
    font-size: 1.02rem;
    font-weight: 700;
  }
  .fx-card p {
    margin: 0 0 0.35rem;
    font-size: 0.82rem;
    line-height: 1.6;
  }
  .fx-card-icon {
    font-size: 1.4rem;
    line-height: 1;
    margin-bottom: 0.45rem;
  }
  @media (min-width: 641px) {
    .fx-card { display: flex; flex-direction: column; height: 100%; }
    .fx-card-link { margin-top: auto; }
  }
  .fx-card-link {
    font-weight: 600;
    text-decoration: none;
    color: rgb(var(--color-primary-600));
  }
  html.dark .fx-card-link {
    color: rgb(var(--color-primary-400));
  }
  @keyframes fx-card-in {
    from { opacity: 0; transform: translateY(24px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
<script src="{{ "js/particles.min.js" | relURL }}" defer></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  // 仅首页生效
  var isHome = document.body.classList.contains("home") ||
               !!document.querySelector("article .prose") &&
               !!document.querySelector('article header h2') &&
               !document.querySelector(".breadcrumbs, nav[aria-label='breadcrumb']");
  // 更稳妥的判断：URL 即站点根路径（兼容 / 和 /en/）
  var path = window.location.pathname;
  isHome = (path === "/" || path === "/index.html" || path === "/en/" || path === "/en/index.html");
  if (!isHome) return;

  // 启用样式
  var st = document.getElementById("fx-style");
  if (st) st.disabled = false;

  // 1) 粒子飘动背景（鼠标悬停可连线）
  var holder = document.createElement("div");
  holder.id = "fx-particles";
  document.body.appendChild(holder);
  if (window.particlesJS) {
    particlesJS("fx-particles", {
      particles: {
        number: { value: 45, density: { enable: true, value_area: 900 } },
        color: { value: "#3e8ed0" },
        shape: { type: "circle" },
        opacity: { value: 0.32, random: true },
        size: { value: 2.5, random: true },
        line_linked: {
          enable: true, distance: 130,
          color: "#3e8ed0", opacity: 0.16, width: 1
        },
        move: {
          enable: true, speed: 0.8, direction: "none",
          random: true, straight: false, out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "window",
        events: {
          onhover: { enable: true, mode: "grab" },
          onclick: { enable: false },
          resize: true
        },
        modes: { grab: { distance: 160, line_linked: { opacity: 0.35 } } }
      },
      retina_detect: true
    });
  }

  // 2) 打字机效果：作者定位标题逐字出现，光标闪烁后淡出
  var el = document.querySelector("article header h2");
  if (el) {
    var text = el.textContent.trim();
    if (text) {
      var textSpan = document.createElement("span");
      var cursor = document.createElement("span");
      cursor.className = "tw-cursor";
      cursor.innerHTML = "&nbsp;";
      el.textContent = "";
      el.appendChild(textSpan);
      el.appendChild(cursor);
      var i = 0;
      (function type() {
        if (i < text.length) {
          textSpan.textContent += text.charAt(i);
          i++;
          setTimeout(type, 90);
        } else {
          setTimeout(function () { cursor.style.display = "none"; }, 3000);
        }
      })();
    }
  }
});
</script>
