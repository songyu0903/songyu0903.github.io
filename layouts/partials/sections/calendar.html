{{ if .Site.Params.calendar.enable | default false }}
{{- $cal := .Site.Language.Params.calendar | default .Site.Params.calendar -}}
<section id="calendar" class="py-0 py-sm-5">
    <div class="container bg-transparent">
        <h3 class="text-center bg-transparent">{{ $cal.title | default "GitHub Activity" }}</h3>
        <div class="bg-transparent row justify-content-center px-3 py-4">
            <div class="col-12 col-lg-10 text-center bg-transparent">
                <a href="{{ printf "https://github.com/%s" .Site.Params.calendar.username }}" target="_blank" rel="noopener">
                    <img src="{{ printf "https://ghchart.rshah.org/%s/%s" (.Site.Params.calendar.color | default "40c463") .Site.Params.calendar.username }}"
                         alt="GitHub contribution calendar"
                         class="img-fluid"
                         loading="lazy"
                         style="width: 100%; max-width: 850px;">
                </a>
                {{ with $cal.caption }}<p class="mt-2 bg-transparent" style="font-size: 0.85rem; opacity: 0.75;">{{ . | markdownify }}</p>{{ end }}
            </div>
        </div>
    </div>
</section>
{{ end }}
