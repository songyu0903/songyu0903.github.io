<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=ZCOOL+KuaiLe&amp;display=swap');
      text { font-family: 'Ma Shan Zheng', 'ZCOOL KuaiLe', 'STKaiti', 'KaiTi', cursive; fill: #2b2b2b; }
      .en { font-family: 'Comic Sans MS', 'Segoe Print', 'Bradley Hand', cursive, sans-serif; }
      .t-title { font-size: 26px; font-weight: 700; }
      .t-body { font-size: 16px; }
      .t-small { font-size: 14px; fill: #6b6b6b; }
      .t-band { font-size: 17px; fill: #8a6a2f; letter-spacing: 1px; }
      .t-chip { font-size: 19px; }
    </style>

    <filter id="sketchy" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="4" seed="4" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <pattern id="hatch-orange" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#f0d080" stroke-width="1.5" opacity="0.45"/>
    </pattern>
    <pattern id="hatch-blue" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#a0c4f0" stroke-width="1.5" opacity="0.45"/>
    </pattern>
    <pattern id="hatch-purple" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#b4a0e8" stroke-width="1.5" opacity="0.45"/>
    </pattern>
    <pattern id="hatch-green" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8ec7a0" stroke-width="1.5" opacity="0.45"/>
    </pattern>

    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 10 6 L 2 9 Z" fill="#d4920a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 10 6 L 2 9 Z" fill="#3b82d0"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 10 6 L 2 9 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 10 6 L 2 9 Z" fill="#2d8a4e"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 2 3 L 10 6 L 2 9 Z" fill="#777"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#fffdf7"/>

  <!-- 标题 -->
  <text x="60" y="58" class="t-title" style="font-size:34px">学术主页 · 架构与写作流程</text>
  <text x="60" y="88" class="t-small">site-redesign ｜ 从「写一篇文章」到「读者打开页面」的完整链路</text>

  <!-- ============ ① 内容流水线 ============ -->
  <rect x="40" y="110" width="1520" height="280" rx="22" fill="#fffaf0" stroke="#e3d5b8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="62" y="140" class="t-band">① 内容流水线（写作 → 发布）</text>

  <!-- n1 写作 -->
  <rect x="60" y="170" width="270" height="160" rx="14" fill="url(#hatch-orange)" stroke="#d4920a" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="60" y="170" width="270" height="160" rx="14" fill="#fef3c7" opacity="0.3"/>
  <text x="195" y="205" text-anchor="middle" class="t-title" style="fill:#92400e">① 写一篇文章</text>
  <text x="195" y="237" text-anchor="middle" class="t-body">正文 + 公式 $…$</text>
  <text x="195" y="263" text-anchor="middle" class="t-body">插图放同目录</text>
  <text x="195" y="289" text-anchor="middle" class="t-body">填 papers.json</text>

  <!-- n2 内容仓 -->
  <rect x="365" y="170" width="270" height="160" rx="14" fill="url(#hatch-blue)" stroke="#3b82d0" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="365" y="170" width="270" height="160" rx="14" fill="#dbeafe" opacity="0.3"/>
  <text x="500" y="205" text-anchor="middle" class="t-title" style="fill:#1e40af">② 内容仓</text>
  <text x="500" y="237" text-anchor="middle" class="t-body en" style="font-size:14px">content/html/*.html</text>
  <text x="500" y="263" text-anchor="middle" class="t-body en" style="font-size:14px">papers · posts · topics</text>
  <text x="500" y="289" text-anchor="middle" class="t-body">17 个源文件</text>

  <!-- n3 构建 -->
  <rect x="670" y="170" width="270" height="160" rx="14" fill="url(#hatch-purple)" stroke="#7c3aed" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="670" y="170" width="270" height="160" rx="14" fill="#ede9fe" opacity="0.3"/>
  <text x="805" y="205" text-anchor="middle" class="t-title" style="fill:#5b21b6">③ 构建站点</text>
  <text x="805" y="237" text-anchor="middle" class="t-body en" style="font-size:14px">node build.mjs</text>
  <text x="805" y="263" text-anchor="middle" class="t-body">生成 dist/ · 51 页</text>
  <text x="805" y="289" text-anchor="middle" class="t-body" style="font-size:15px">sitemap · RSS · 搜索索引</text>

  <!-- n4 预览与自检 -->
  <rect x="975" y="170" width="270" height="160" rx="14" fill="url(#hatch-green)" stroke="#2d8a4e" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="975" y="170" width="270" height="160" rx="14" fill="#d1fae5" opacity="0.3"/>
  <text x="1110" y="205" text-anchor="middle" class="t-title" style="fill:#065f46">④ 预览 + 自检</text>
  <text x="1110" y="237" text-anchor="middle" class="t-body en" style="font-size:13.5px">mirror · serve 4173</text>
  <text x="1110" y="263" text-anchor="middle" class="t-body en" style="font-size:13.5px">crawl · imgcheck · cdp-test</text>
  <text x="1110" y="289" text-anchor="middle" class="t-body" style="font-size:15px">坏链 0 · 缺图 0 · 15/15</text>

  <!-- n5 发布 -->
  <rect x="1280" y="170" width="270" height="160" rx="14" fill="url(#hatch-blue)" stroke="#3b82d0" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="1280" y="170" width="270" height="160" rx="14" fill="#dbeafe" opacity="0.3"/>
  <text x="1415" y="205" text-anchor="middle" class="t-title" style="fill:#1e40af">⑤ 发布上线</text>
  <text x="1415" y="237" text-anchor="middle" class="t-body en" style="font-size:14px">node deploy.mjs</text>
  <text x="1415" y="263" text-anchor="middle" class="t-body">GitHub API 提交</text>
  <text x="1415" y="289" text-anchor="middle" class="t-body">Pages 构建 ≈23 秒</text>

  <!-- 流水线箭头 -->
  <line x1="334" y1="250" x2="359" y2="250" stroke="#d4920a" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <line x1="639" y1="250" x2="664" y2="250" stroke="#3b82d0" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="944" y1="250" x2="969" y2="250" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <line x1="1249" y1="250" x2="1274" y2="250" stroke="#2d8a4e" stroke-width="4" marker-end="url(#arrow-green)"/>

  <!-- n5 → 线上 -->
  <path d="M 1415 336 L 1415 404 L 1300 404 L 1300 472" fill="none" stroke="#3b82d0" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <!-- ============ ② 线上与读者 ============ -->
  <rect x="40" y="430" width="1520" height="210" rx="22" fill="#f7f9ff" stroke="#c9d6ee" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="62" y="460" class="t-band" style="fill:#3b5a8a">② 线上站点与读者</text>

  <text x="80" y="510" class="t-body" style="font-size:17px;fill:#42506b">整站是纯静态文件：</text>
  <text x="80" y="540" class="t-body" style="font-size:16px;fill:#5b6b85">没有数据库、没有服务端渲染</text>
  <text x="80" y="568" class="t-body" style="font-size:16px;fill:#5b6b85">页面 = HTML + CSS + 一点 JS</text>
  <text x="80" y="596" class="t-body" style="font-size:16px;fill:#5b6b85">推送到 main，Pages 自动重建</text>
  <!-- n6 线上 -->
  <rect x="1120" y="480" width="360" height="140" rx="14" fill="url(#hatch-blue)" stroke="#3b82d0" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="1120" y="480" width="360" height="140" rx="14" fill="#dbeafe" opacity="0.28"/>
  <text x="1300" y="518" text-anchor="middle" class="t-title en" style="fill:#1e40af;font-size:24px">GitHub Pages</text>
  <text x="1300" y="546" text-anchor="middle" class="t-body en" style="font-size:14px">songyu0903.github.io</text>
  <text x="1300" y="572" text-anchor="middle" class="t-body">main 分支 · 静态托管</text>
  <text x="1300" y="598" text-anchor="middle" class="t-body" style="font-size:15px">全球 CDN · 自动构建</text>

  <!-- n7 读者 -->
  <rect x="560" y="480" width="380" height="140" rx="14" fill="url(#hatch-green)" stroke="#2d8a4e" stroke-width="3.5" filter="url(#sketchy)"/>
  <rect x="560" y="480" width="380" height="140" rx="14" fill="#d1fae5" opacity="0.28"/>
  <text x="750" y="518" text-anchor="middle" class="t-title" style="fill:#065f46">读者浏览器</text>
  <text x="750" y="546" text-anchor="middle" class="t-body">HTML + CSS 直接可读</text>
  <text x="750" y="572" text-anchor="middle" class="t-body">KaTeX 客户端渲染公式</text>
  <text x="750" y="598" text-anchor="middle" class="t-body" style="font-size:15px">Ctrl+K 搜索 · 浅色 / 深色</text>

  <!-- 线上 → 读者 -->
  <line x1="1114" y1="550" x2="950" y2="550" stroke="#2d8a4e" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1032" y="588" text-anchor="middle" class="t-small" style="font-size:13px">HTTPS 静态文件</text>

  <!-- 回流虚线 -->
  <path d="M 1100 476 L 1100 404 L 195 404 L 195 340" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="14 10" marker-end="url(#arrow-gray)"/>
  <text x="560" y="392" text-anchor="middle" class="t-small" style="font-size:14px">内容有误或要更新 → 改 content/ 再跑一遍</text>

  <!-- ============ ③ 站点结构 ============ -->
  <rect x="40" y="660" width="1520" height="200" rx="22" fill="#fbf9f4" stroke="#e0d6c2" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="62" y="692" class="t-band">③ 站点结构（51 页 · 8 篇论文 · 26 个标签页）</text>

  <!-- chips -->
  <g>
    <rect x="62" y="712" width="228" height="72" rx="12" fill="#fef3c7" stroke="#d4920a" stroke-width="3" filter="url(#sketchy)"/>
    <text x="176" y="742" text-anchor="middle" class="t-chip" style="fill:#92400e">首页 /</text>
    <text x="176" y="766" text-anchor="middle" class="t-small">首屏 · 五个精选 · 时间线</text>
  </g>
  <g>
    <rect x="312" y="712" width="228" height="72" rx="12" fill="#dbeafe" stroke="#3b82d0" stroke-width="3" filter="url(#sketchy)"/>
    <text x="426" y="742" text-anchor="middle" class="t-chip" style="fill:#1e40af">论文 ×8</text>
    <text x="426" y="766" text-anchor="middle" class="t-small">可复现实验 · BibTeX</text>
  </g>
  <g>
    <rect x="562" y="712" width="228" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" filter="url(#sketchy)"/>
    <text x="676" y="742" text-anchor="middle" class="t-chip" style="fill:#5b21b6">研究方向 ×6</text>
    <text x="676" y="766" text-anchor="middle" class="t-small">核心问题 · 先读哪篇</text>
  </g>
  <g>
    <rect x="812" y="712" width="228" height="72" rx="12" fill="#d1fae5" stroke="#2d8a4e" stroke-width="3" filter="url(#sketchy)"/>
    <text x="926" y="742" text-anchor="middle" class="t-chip" style="fill:#065f46">笔记 ×4</text>
    <text x="926" y="766" text-anchor="middle" class="t-small">排版 · 工作流</text>
  </g>
  <g>
    <rect x="1062" y="712" width="228" height="72" rx="12" fill="#fef3c7" stroke="#d4920a" stroke-width="3" filter="url(#sketchy)"/>
    <text x="1176" y="742" text-anchor="middle" class="t-chip" style="fill:#92400e">标签 ×26</text>
    <text x="1176" y="766" text-anchor="middle" class="t-small">沿用旧站 slug</text>
  </g>
  <g>
    <rect x="1312" y="712" width="228" height="72" rx="12" fill="#dbeafe" stroke="#3b82d0" stroke-width="3" filter="url(#sketchy)"/>
    <text x="1426" y="742" text-anchor="middle" class="t-chip" style="fill:#1e40af">关于</text>
    <text x="1426" y="766" text-anchor="middle" class="t-small">教育 · 技能 · 简历</text>
  </g>

  <!-- 日常命令 -->
  <text x="62" y="828" class="t-small en" style="font-size:15px;fill:#4b5563">build → mirror → serve → deploy → verify-live ｜ 公式 $…$ 由 KaTeX 在读者端渲染，搜索索引 62 KB 在打开搜索时才加载</text>
</svg>


