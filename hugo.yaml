  # About 关于我
  about:
    enable: true
    title: "关于我 / About Me"
    content: |-
      我是一名数学专业的硕士研究生，研究方向为**投资组合优化**（Portfolio Optimization），目前处于开题前的文献调研阶段，目标是在该方向完成学术研究并发表成果。

      *I am a graduate student in mathematics. My research focuses on **portfolio optimization**. I am currently conducting a systematic literature review in preparation for my thesis proposal, with the goal of producing publishable research.*

      研究兴趣 / Research interests:

      - 投资组合优化与资产配置 / Portfolio optimization & asset allocation
      - 金融中的优化方法（凸优化、随机优化、鲁棒优化）/ Optimization methods in finance
      - 量化金融与金融数学 / Quantitative finance & financial mathematics
    skills:
      enable: true
      title: "常用工具 / Toolbox:"
      items:
        - "Python"
        - "MATLAB"
        - "LaTeX"
        - "Markdown"
        - "Git"
        - "Obsidian"
        - "VS Code"

