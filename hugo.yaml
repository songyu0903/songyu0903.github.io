    items:
      - title: "投资组合优化 / Portfolio Optimization"
        content: '从经典均值—方差框架 \(\min_w w^{\top}\Sigma w\) 出发，关注鲁棒优化与分布鲁棒优化在现代组合选择中的应用。From the classical mean-variance framework to robust and distributionally robust portfolio selection.'
        badges:
          - "凸优化"
          - "鲁棒优化"
          - "量化金融"
        links:
