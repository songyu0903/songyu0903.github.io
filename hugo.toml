# 站点配置：Hugo Book 主题（https://themes.gohugo.io/themes/hugo-book/）
# 2026-10-04 由 HugoBlox 迁移至 Hugo Book（旧主题的配置、依赖与缓存已于同日清理）

baseURL = "https://songyu0903.github.io/"
title = "Y.S"
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
theme = "hugo-book"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 笔记中保留原始 HTML
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      # 保护 LaTeX 公式（含 \{ \} \_ 等转义）不被 Markdown 解析破坏
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  # 主题外观：light | dark | auto
  BookTheme = "auto"
  BookToC = true
  # 侧边栏目录树（docs/menu-filetree.html）以站点顶层为根：
  # * = 首页的直接子页/子章节 → 侧栏只显示「关于」与「笔记专题」两个大目录
  # （笔记专题下含 6 个专题页；单篇笔记用 bookHidden 隐藏，不列标题目录）
  BookSection = "*"
  BookLogo = "favicon.ico"
  BookSearch = true
  BookBreadcrumbs = false
  BookComments = false
  BookServiceWorker = false
  BookPortableLinks = false
  BookDateFormat = "2006-01-02"

[languages]
  [languages.zh]
    label = "简体中文"
    weight = 1
    title = "Y.S"

[menu]
  # 首页顶部导航（仅主题 landing 版式使用；当前首页走标准版式，此项不显示）
  [[menu.home]]
    name = "🏠 首页"
    pageRef = "/"
    weight = 1
  [[menu.home]]
    name = "👤 关于"
    pageRef = "about"
    weight = 2
  [[menu.home]]
    name = "📝 笔记专题"
    pageRef = "topics"
    weight = 3

  # 侧边栏底部链接（目录树之外的全局入口）
  [[menu.after]]
    name = "📚 全部笔记"
    pageRef = "blog"
    weight = 10
  [[menu.after]]
    name = "🐙 GitHub"
    url = "https://github.com/songyu0903"
    weight = 20