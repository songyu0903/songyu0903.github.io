# 站点配置：Hugo Book 主题（https://themes.gohugo.io/themes/hugo-book/）
# 2026-10-04 由 HugoBlox 迁移至 Hugo Book；旧配置备份见 _blox-backup/

baseURL = "https://songyu0903.github.io/"
title = "songyu0903"
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
theme = "hugo-book"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 笔记中保留原始 HTML
      unsafe = true
    [markup.goldmark.extensions.passthrough]
      # 保护 LaTeX 公式（含 \{ \} \_ 等转义）不被 Markdown 解析破坏
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  # 主题外观：light | dark | auto
  BookTheme = "auto"
  BookToC = true
  # 侧边栏目录树（docs/menu-filetree.html）渲染该章节的子页 -> 全部阅读笔记
  BookSection = "blog"
  BookLogo = "favicon.ico"
  BookSearch = true
  BookBreadcrumbs = false
  BookComments = false
  BookServiceWorker = false
  BookPortableLinks = false
  BookDateFormat = "2006-01-02"

[languages]
  [languages.zh]
    label = "简体中文"
    weight = 1
    title = "songyu0903"

[menu]
  # 首页（landing 布局）顶部导航
  [[menu.home]]
    name = "🏠 首页"
    pageRef = "/"
    weight = 1
  [[menu.home]]
    name = "👤 关于"
    pageRef = "about"
    weight = 2
  [[menu.home]]
    name = "📝 笔记"
    pageRef = "blog"
    weight = 3

  # 侧边栏底部链接
  [[menu.after]]
    name = "👤 关于"
    pageRef = "about"
    weight = 10
  [[menu.after]]
    name = "🐙 GitHub"
    url = "https://github.com/songyu0903"
    weight = 20